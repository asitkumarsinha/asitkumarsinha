[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-python"
version = "0.1.0"
description = "A minimal Hello world project in Python."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl",
]

[project.scripts]
hello-world = "hello_world.main:main"
